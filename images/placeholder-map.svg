<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#C4A882"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B7355"/>
      <stop offset="100%" style="stop-color:#5C554E"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="600" fill="#F5F0E8"/>
  <!-- Background Pattern -->
  <pattern id="dotPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1" fill="#8B7355" opacity="0.15"/>
  </pattern>
  <rect width="1000" height="600" fill="url(#dotPattern)"/>
  <!-- Central Card -->
  <rect x="350" y="150" width="300" height="300" rx="4" fill="white" stroke="#C4A882" stroke-width="1" opacity="0.9"/>
  <rect x="360" y="160" width="280" height="280" rx="2" fill="none" stroke="#8B7355" stroke-width="0.5" opacity="0.3"/>
  <text x="500" y="280" text-anchor="middle" font-family="Georgia,serif" font-size="36" font-weight="bold" fill="url(#gold2)" letter-spacing="6">MAP</text>
  <text x="500" y="320" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="14" fill="#5C554E" letter-spacing="3">全国门店分布图</text>
  <text x="500" y="360" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#8C857E" letter-spacing="2">STORE LOCATION PLACEHOLDER</text>
</svg>
